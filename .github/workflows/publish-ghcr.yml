name: Publicar imagem (GHCR)

# Constrói a imagem Docker (Dockerfile na raiz) e publica-a no GitHub Container
# Registry a cada push para main. A Azure App Service lê-a de lá (docs/18).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # O GHCR exige nomes em minúsculas; "Eng-Ernesto" tem maiúsculas, por isso fica fixo aqui.
  IMAGE: ghcr.io/eng-ernesto/terravisao

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Além de :latest, uma etiqueta fixa por commit: a Azure App Service (ligada a
          # "Outros registos de contentor") não repete o docker pull quando a etiqueta não
          # muda, mesmo depois de Parar/Iniciar. Apontar para :<sha> força sempre a imagem certa.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
