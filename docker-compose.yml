services:
  geoexplora:
    build: .
    image: geoexplora:dev
    ports:
      - "8501:8501"
    volumes:
      # Cache de descargas e análises novas persistem entre execuções.
      - ./data/cache:/srv/data/cache
    environment:
      TERRAVISAO_CACHE_DIR: /srv/data/cache
      GEOEXPLORA_ROOT: /srv
