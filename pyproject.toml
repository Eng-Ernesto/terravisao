[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terravisao"
version = "0.1.0"
description = "TerraVisão — plataforma de prospecção inteligente (triagem com dados públicos) para Angola"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Dependências geoespaciais pesadas ficam separadas para o núcleo ser leve e testável.
geo = [
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "geopandas>=0.14",
    "pystac-client>=0.8",
    "odc-stac>=0.3",
    "scipy>=1.11",
    "scikit-image>=0.22",
]
app = [
    "streamlit>=1.35",
    "folium>=0.16",
    "streamlit-folium>=0.20",
    "pydeck>=0.9",
]
report = [
    "matplotlib>=3.8",
    "reportlab>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-shapely",
]

[project.scripts]
terravisao = "terravisao.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/terravisao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: precisa de acesso à rede (excluído do CI por defeito)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# CSS e HTML embebidos têm linhas longas por natureza.
"app/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "skimage.*", "scipy.*", "odc.*", "pystac_client.*", "affine", "geopandas.*", "rioxarray.*"]
ignore_missing_imports = true

# Bibliotecas científicas sem tipos: não exigir tipagem nas chamadas a elas.
[[tool.mypy.overrides]]
module = ["terravisao.*"]
disallow_untyped_calls = false
warn_return_any = false
